# Ubichinon production reverse proxy — HTTP entry point.
# Mounted at /etc/nginx/conf.d/default.conf in the nginx service.
#
# Deployment flow:
#   1. Bring the stack up with this file (HTTP only).
#   2. Obtain a Let's Encrypt certificate via webroot:
#        certbot certonly --webroot -w /opt/ai-agent/deploy/certbot-webroot -d ikarpedia.cloud
#   3. Copy fullchain.pem/privkey.pem into deploy/certs/.
#   4. Copy tls.conf into this directory (same mount), then reload nginx.
#
# After TLS is live, replace the "location / { proxy ... }" for the frontend with
# a redirect so plaintext HTTP no longer serves the app:
#     location / {
#         return 301 https://$host$request_uri;
#     }
# (keep the /.well-known/acme-challenge/ location for renewals).

# Shared rate-limit zone (defined once here, used by default.conf and tls.conf).
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=1r/s;

server {
    listen 80;
    server_name ikarpedia.cloud;
    server_tokens off;

    client_max_body_size 1m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Security headers (inherited by all locations).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Let's Encrypt webroot challenge (certbot).
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Login is throttled at the edge (real client IP) as defense-in-depth.
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API backend (same-origin: browser calls /api/... on this host).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health check.
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Next.js frontend (standalone server on port 3000).
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}