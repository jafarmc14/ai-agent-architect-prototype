# Ubichinon production reverse proxy — HTTP entry point.
# Mounted at /etc/nginx/conf.d/default.conf in the nginx service.
#
# Deployment flow:
#   1. Bring the stack up with this file (HTTP only).
#   2. Obtain a Let's Encrypt certificate via webroot:
#        certbot certonly --webroot -w /opt/ai-agent/deploy/certbot-webroot -d ikarpedia.cloud
#   3. Copy fullchain.pem/privkey.pem into deploy/certs/.
#   4. Copy tls.conf into this directory (same mount), then reload nginx.

server {
    listen 80;
    server_name ikarpedia.cloud;

    # Let's Encrypt webroot challenge (certbot).
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # API backend (same-origin: browser calls /api/... on this host).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend health check.
    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Next.js frontend (standalone server on port 3000).
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}