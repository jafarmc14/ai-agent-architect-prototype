# Ubichinon production TLS listener — copy into the nginx conf.d mount AFTER
# certificates exist at deploy/certs/fullchain.pem and deploy/certs/privkey.pem.
#
#   cp deploy/nginx/tls.conf deploy/nginx/conf.d-tls/tls.conf   (or replace default.conf with a redirect)
#
# Recommended layout once TLS is active:
#   - this file: listen 443 ssl, full proxy rules.
#   - a small HTTP server that redirects to https (add to default.conf or this file).
#
# Certificates are mounted read-only into /etc/nginx/certs.

server {
    listen 443 ssl;
    http2 on;
    server_name ikarpedia.cloud;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Let's Encrypt webroot challenge (renewal).
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # API backend (same-origin).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Next.js frontend.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}