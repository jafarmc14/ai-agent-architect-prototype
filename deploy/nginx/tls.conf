# Ubichinon production TLS listener — copy into the nginx conf.d mount AFTER
# certificates exist at deploy/certs/fullchain.pem and deploy/certs/privkey.pem.
#
#   cp deploy/nginx/tls.conf deploy/nginx/conf.d-tls/tls.conf   (or replace default.conf with a redirect)
#
# Once TLS is live, edit default.conf so port 80 only serves the ACME challenge
# and redirects everything else to https (see the comment in default.conf).
#
# Certificates are mounted read-only into /etc/nginx/certs.

# The rate-limit zone is defined in default.conf (single definition required).

server {
    listen 443 ssl;
    http2 on;
    server_name ikarpedia.cloud;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Security headers (inherited by all locations). HSTS only on TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Let's Encrypt webroot challenge (renewal).
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # Login is throttled at the edge (real client IP).
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API backend (same-origin).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Next.js frontend.
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}