services:
  frontend:
    image: ai-agent-frontend:dev
    build:
      context: ./frontend
      target: dependencies
    working_dir: /app
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ai-agent-backend:dev
    build:
      context: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      APP_ENV: development
      DEBUG: "true"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: http://localhost:8000
      API_CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:8501,http://127.0.0.1:8501
      DATABASE_PROVIDER: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      EMBEDDING_API_BASE: http://host.docker.internal:11434/v1
      OLLAMA_API_BASE: http://host.docker.internal:11434/v1
      RUN_DATABASE_MIGRATIONS: "true"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - ai_agent_postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-backup:
    profiles: ["backup"]
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-postgres}
      PGDATABASE: ${POSTGRES_DB:-ai_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      BACKUP_DIR: /backups
      BACKUP_RETENTION_DAYS: "14"
    volumes:
      - ./scripts:/scripts:ro
      - ai_agent_postgres_dev_backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/bash"]
    command: ["/scripts/backup_postgres.sh"]

volumes:
  ai_agent_postgres_dev_data:
  ai_agent_postgres_dev_backups:
  frontend_node_modules:
  frontend_next:
  redis_dev_data:
