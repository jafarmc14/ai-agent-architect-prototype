services:
  nginx:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx:/etc/nginx/conf.d:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/certbot-webroot:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${FRONTEND_IMAGE:-ai-agent-frontend:latest}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    mem_limit: 1g
    cpus: "1"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    image: ${BACKEND_IMAGE:-ai-agent-backend:latest}
    build:
      context: .
    environment:
      APP_ENV: production
      DEBUG: "false"
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_BASE_URL: ${API_BASE_URL:-https://ikarpedia.cloud}
      API_CORS_ORIGINS: ${API_CORS_ORIGINS:-https://ikarpedia.cloud}
      DATABASE_PROVIDER: postgres
      RUN_DATABASE_MIGRATIONS: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-openrouter}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openrouter/free}
      OPENROUTER_API_BASE: ${OPENROUTER_API_BASE:-https://openrouter.ai/api/v1}
      EMBEDDING_API_BASE: ${EMBEDDING_API_BASE:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    secrets:
      - database_url
      - jwt_secret_current
      - jwt_secret_previous
      - openrouter_api_key
      - deepseek_api_key
      - kimi_api_key
      - embedding_api_key
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped
    mem_limit: 2g
    cpus: "2"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_agent}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - ai_agent_postgres_prod_data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1536m
    cpus: "1"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    volumes:
      - redis_prod_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy noeviction
    restart: unless-stopped
    mem_limit: 256m
    cpus: "0.5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  ai_agent_postgres_prod_data:
  redis_prod_data:

secrets:
  database_url:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/database_url
  postgres_password:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/postgres_password
  jwt_secret_current:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/jwt_secret_current
  jwt_secret_previous:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/jwt_secret_previous
  openrouter_api_key:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/openrouter_api_key
  deepseek_api_key:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/deepseek_api_key
  kimi_api_key:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/kimi_api_key
  embedding_api_key:
    file: ${PRODUCTION_SECRETS_DIR:-./.secrets}/embedding_api_key